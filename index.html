<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PodcastApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <a class="logo" href="#">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="11" r="3"/>
        <path d="M12 2a7 7 0 0 1 7 7c0 5.25-7 13-7 13S5 14.25 5 9a7 7 0 0 1 7-7z"/>
      </svg>
      PodcastApp
    </a>
    <div class="header-icons">
      <button class="icon-btn" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      <button class="icon-btn" aria-label="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Filters ── -->
  <div class="filters-bar">
    <span class="filter-label">Filter by:</span>
    <div class="select-wrapper">
      <select id="genre-select" aria-label="Filter by genre">
        <option value="all">All Genres</option>
      </select>
    </div>
    <div class="select-wrapper">
      <select id="sort-select" aria-label="Sort order">
        <option value="recently_updated">Recently Updated</option>
        <option value="most_popular">Most Popular</option>
        <option value="newest">Newest</option>
      </select>
    </div>
  </div>

  <!-- ── Podcast Grid ── -->
  <main class="grid" id="podcast-grid" role="list"></main>

  <!-- ── Modal ── -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close" aria-label="Close modal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="modal-top">
          <img class="modal-image" id="modal-image" src="" alt="">
          <div class="modal-meta">
            <p class="modal-section-title">Description</p>
            <p class="modal-description" id="modal-description"></p>
            <p class="modal-section-title">Genres</p>
            <div class="tags" id="modal-genres"></div>
            <div class="modal-updated" id="modal-updated"></div>
          </div>
        </div>
      </div>

      <div class="modal-divider"></div>

      <div class="modal-seasons">
        <h3 class="seasons-title">Seasons</h3>
        <div id="modal-seasons-list"></div>
      </div>
    </div>
  </div>

  <!-- Entry point (ES module) -->
  <script type="module" src="main.js"></script>
</body>
</html>
